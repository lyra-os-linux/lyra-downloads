[package]
name = "lyra-downloads-gtk"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Interface GTK4/libadwaita do Lyra Downloads"

[[bin]]
name = "lyra-downloads"
path = "src/main.rs"

[dependencies]
lyra-downloads-core = { path = "../lyra-downloads-core" }
lyra-downloads-ipc = { path = "../lyra-downloads-ipc" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_12"] }
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
gettext-rs.workspace = true
