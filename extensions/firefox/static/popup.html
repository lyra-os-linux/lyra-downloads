<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header>
    <img src="icons/icon.svg" alt="" width="32" height="32">
    <div>
      <h1>Lyra Downloads</h1>
      <p id="status" role="status" aria-live="polite" data-i18n="statusChecking"></p>
    </div>
  </header>
  <p id="status-detail" class="detail"></p>
  <label class="check toggle">
    <input type="checkbox" id="default-toggle">
    <span>
      <strong data-i18n="popupDefault"></strong>
      <small id="default-summary" class="detail"></small>
    </span>
  </label>
  <p id="toggle-message" class="detail" role="status" aria-live="polite"></p>
  <div class="actions">
    <button id="open-app" class="primary" data-i18n="openApp"></button>
    <button id="open-options" data-i18n="openOptions"></button>
  </div>
  <section id="entries-section" hidden>
    <h2 data-i18n="recentHandoffs"></h2>
    <ul id="entries"></ul>
  </section>
  <script type="module" src="popup.js"></script>
</body>
</html>
