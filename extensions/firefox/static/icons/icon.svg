<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Ícone provisório (não aprovado como logo oficial), no estilo dos
       demais aplicativos Lyra: quadrado arredondado com degradê e
       pictograma simples. Três fluxos paralelos (conexões) convergem
       para uma seta de download sobre uma bandeja. -->
  <defs>
    <linearGradient id="bg" x1="24" y1="10" x2="104" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9b7bf7"/>
      <stop offset="1" stop-color="#4a2ea6"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>

  <!-- Conexões paralelas -->
  <path d="M44 26v22M64 22v40M84 26v22" fill="none" stroke="#ffffff" stroke-opacity="0.55"
        stroke-width="6" stroke-linecap="round"/>
  <path d="M44 48c0 10 20 10 20 18M84 48c0 10-20 10-20 18" fill="none" stroke="#ffffff"
        stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>

  <!-- Seta de download -->
  <path d="M64 58v24" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <path d="m50 72 14 14 14-14" fill="none" stroke="#ffffff" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bandeja -->
  <path d="M32 86v8a8 8 0 0 0 8 8h48a8 8 0 0 0 8-8v-8" fill="none" stroke="#ffffff"
        stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
